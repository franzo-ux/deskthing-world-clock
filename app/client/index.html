<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>World Clock</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #0b0f0c; color: #c8f7c5; overflow: hidden; height: 100vh;
    font-family: "DejaVu Sans Mono", Consolas, monospace;
  }
  /* The Car Thing knob covers the right edge: keep everything clear of it. */
  .app { height: 100vh; padding: 12px 84px 10px 22px; display: flex; flex-direction: column; }
  .hd { color: #5c6b5a; font-size: 15px; display: flex; flex-shrink: 0; }
  .hd .upd { margin-left: auto; }
  .rows { flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
  .row { display: flex; align-items: center; }
  .city { width: 220px; font-size: 22px; line-height: 1.2; }
  .city small { display: block; font-size: 13px; color: #5c6b5a; }
  .row.night .city small .dn { color: #8fa3ff; }
  .row.day .city small .dn { color: #F1BE58; }
  .time { width: 190px; font-size: 48px; color: #e8ffe4; letter-spacing: 1px; }
  .time .colon { animation: colon 2s steps(1) infinite; }
  @keyframes colon { 50% { opacity: .25; } }
  .ic { width: 110px; height: 66px; display: flex; align-items: center; justify-content: center; }
  .temp { width: 100px; text-align: right; font-size: 26px; color: #F1BE58; }
  .desc { display: block; font-size: 12px; color: #5c6b5a; text-align: right; }

  /* ---------- neon icons ---------- */
  .neon { filter: drop-shadow(0 0 3px rgba(111,227,255,.75)); overflow: visible; }
  .neon.warm { filter: drop-shadow(0 0 3px rgba(241,190,88,.8)); }
  .rays { animation: spin 18s linear infinite; transform-origin: 32px 32px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .core { animation: pulse 3s ease-in-out infinite; transform-origin: 32px 32px; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .glow { animation: glow 4s ease-in-out infinite; }
  @keyframes glow { 50% { opacity: .55; } }
  .float { animation: float 4s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-2px); } }
  .drop { animation: drop 1.1s linear infinite; }
  .drop.d2 { animation-delay: -.37s; } .drop.d3 { animation-delay: -.73s; }
  @keyframes drop { 0% { transform: translateY(-4px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(8px); opacity: 0; } }
  .flake { animation: flake 2.4s linear infinite; }
  .flake.d2 { animation-delay: -.8s; } .flake.d3 { animation-delay: -1.6s; }
  @keyframes flake { 0% { transform: translateY(-3px); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(9px); opacity: 0; } }
  .bolt { animation: bolt 3.2s steps(1) infinite; }
  @keyframes bolt { 0%, 100% { opacity: .25; } 8% { opacity: 1; } 12% { opacity: .3; } 16% { opacity: 1; } 30% { opacity: .25; } }
  .fog1 { animation: drift 5s ease-in-out infinite; }
  .fog2 { animation: drift 5s ease-in-out infinite reverse; }
  @keyframes drift { 50% { transform: translateX(5px); } }

  /* banner shown just before switching to another app */
  .alert { position: fixed; left: 0; right: 0; top: 0; bottom: 0; display: none; z-index: 20;
    align-items: center; justify-content: center; padding-right: 70px; background: #12070c; text-align: center; }
  .alert.show { display: flex; animation: gjit .3s steps(1) infinite; }
  .alert::after { content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0, rgba(0,0,0,.35) 2px, transparent 2px, transparent 4px); }
  #alert-text { font-size: 30px; font-weight: 700; color: #ffb3a6; max-width: 92%;
    text-shadow: 3px 0 rgba(255,40,100,.9), -3px 0 rgba(0,230,255,.9); animation: gtext .6s steps(1) infinite; }
  @keyframes gjit { 0% { transform: none; } 25% { transform: translate(-3px, 1px) skewX(4deg); }
    50% { transform: translate(2px, 0); } 75% { transform: translate(4px, -1px) skewX(-6deg); } }
  @keyframes gtext { 0%, 100% { text-shadow: 3px 0 rgba(255,40,100,.9), -3px 0 rgba(0,230,255,.9); }
    50% { text-shadow: -4px 0 rgba(255,40,100,.9), 4px 0 rgba(0,230,255,.9); } }
</style>
</head>
<body>
  <div class="app">
    <div class="hd"><span>$ date --world</span><span id="upd" class="upd"></span></div>
    <div id="rows" class="rows"><div class="row"><span class="city">connecting…</span></div></div>
  </div>
  <div id="alert" class="alert"><div id="alert-text"></div></div>
  <script src="./main.js"></script>
</body>
</html>
